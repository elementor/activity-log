name: Commit Lint

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install commitlint
        run: |
          npm install --prefix "$RUNNER_TEMP/commitlint" --no-save --no-audit --no-fund @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
          ln -s "$RUNNER_TEMP/commitlint/node_modules" node_modules

      - name: Lint commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" | npx commitlint
          else
            printf '%s\n' "$COMMIT_MSG" | head -n 1 | npx commitlint
          fi
